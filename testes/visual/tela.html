<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Automático — banca visual</title>
<link rel="stylesheet" href="../../web/estilo.css"></head>
<body>
  <div id="raiz"></div>
  <script src="mock.js"></script>
  <script src="../../web/app.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    setTimeout(() => {
      if (q.get('aba')) { aba = q.get('aba'); desenhar(); }
      if (q.get('grupo')) setTimeout(() => { const g = document.getElementById('g-' + q.get('grupo')); g && g.scrollIntoView(); }, 600);
      if (q.get('menu')) setTimeout(() => { const b = document.querySelector('[data-mais="' + q.get('menu') + '"]'); b && b.click(); }, 400);
      if (q.get('busca')) setTimeout(() => { const i = document.getElementById('guia-busca'); if (i) { i.value = q.get('busca'); i.oninput(); } }, 500);
      if (q.get('enviar')) setTimeout(() => { const e = document.getElementById('entrada'); if (e) { e.value = q.get('enviar'); document.getElementById('enviar').click(); } }, 500);
    }, 300);
  </script>
</body>
</html>
